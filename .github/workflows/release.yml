name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    name: "Create GitHub Release"
    permissions:
      contents: write
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements_test.txt

      - name: Run all validation checks
        run: |
          # Lint check
          pip install ruff mypy
          ruff check custom_components/
          mypy custom_components/ --ignore-missing-imports
          
          # Test check
          pytest --cov=custom_components/vonage

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Verify manifest version matches tag
        run: |
          MANIFEST_VERSION=$(grep '"version"' custom_components/vonage/manifest.json | cut -d'"' -f4)
          TAG_VERSION="${{ steps.version.outputs.version }}"
          if [ "$MANIFEST_VERSION" != "$TAG_VERSION" ]; then
            echo "Version mismatch: manifest.json has $MANIFEST_VERSION but tag is v$TAG_VERSION"
            exit 1
          fi
          echo "Version verified: $TAG_VERSION"

      - name: Create release archive
        run: |
          mkdir -p release
          cp -r custom_components/vonage release/
          cd release
          zip -r ../vonage-${{ steps.version.outputs.version }}.zip .

      - name: Generate changelog
        id: changelog
        run: |
          # Simple changelog generation - in production, consider using conventional commits
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            echo "## Changes in v${{ steps.version.outputs.version }}" > notes.md
            echo "" >> notes.md
            git log --pretty=format:"- %s" $PREV_TAG..HEAD >> notes.md
          else
            echo "## Initial Release v${{ steps.version.outputs.version }}" > notes.md
            echo "" >> notes.md
            echo "First release of the Vonage Home Assistant Integration." >> notes.md
          fi
          echo "" >> notes.md
          echo "" >> notes.md
          echo "## Installation" >> notes.md
          echo "" >> notes.md
          echo "### HACS" >> notes.md
          echo "This release is available in HACS. Search for 'Vonage' in the Integrations section." >> notes.md
          echo "" >> notes.md
          echo "### Manual Installation" >> notes.md
          echo "1. Download the \`vonage.zip\` file below" >> notes.md
          echo "2. Extract to \`custom_components/vonage/\` in your Home Assistant config" >> notes.md
          echo "3. Restart Home Assistant" >> notes.md
          echo "" >> notes.md
          echo "## Full Changelog" >> notes.md
          echo "See [CHANGELOG.md](CHANGELOG.md) for detailed changes." >> notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release v${{ steps.version.outputs.version }}
          body_path: notes.md
          draft: false
          prerelease: false
          files: |
            vonage-${{ steps.version.outputs.version }}.zip